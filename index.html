    <script>
      (() => {
        const applyMobileChargerFix = () => {
          if (window.innerWidth > 720) return false;

          const img = document.querySelector('.story-mobile-image img[src*="Charger.png"]');
          if (!img) return false;

          const box = img.closest('.story-mobile-image');
          if (!box) return false;

          box.style.setProperty('height', 'auto', 'important');
          box.style.setProperty('min-height', '0', 'important');
          box.style.setProperty('background', '#d8d3ca', 'important');
          box.style.setProperty('overflow', 'hidden', 'important');
          box.style.setProperty('display', 'block', 'important');

          img.style.setProperty('width', '100%', 'important');
          img.style.setProperty('height', 'auto', 'important');
          img.style.setProperty('max-height', 'none', 'important');
          img.style.setProperty('object-fit', 'contain', 'important');
          img.style.setProperty('object-position', 'center center', 'important');
          img.style.setProperty('background', '#d8d3ca', 'important');
          img.style.setProperty('transform', 'none', 'important');

          return true;
        };

        const applyFooterCreditFix = () => {
          const footerBottom = document.querySelector('.footer-bottom');
          if (!footerBottom) return false;

          if (footerBottom.dataset.txCreditFixed === '1') return true;
          footerBottom.dataset.txCreditFixed = '1';

          footerBottom.innerHTML = `
            <p class="custom-footer-line">
              <span>Built by</span>
              <a href="https://technical-x.com" target="_blank" rel="noopener" aria-label="Technical X">
                <img src="/images/logo-footer.png" alt="Technical X">
              </a>
              <span>© 2016 yourevcharge.com</span>
            </p>
          `;

          return true;
        };

        let scheduled = false;
        let completed = false;

        const runFixes = () => {
          scheduled = false;
          const chargerFixed = applyMobileChargerFix();
          const footerFixed = applyFooterCreditFix();

          if (footerFixed && (chargerFixed || window.innerWidth > 720)) {
            completed = true;
            observer.disconnect();
          }
        };

        const scheduleRun = () => {
          if (completed || scheduled) return;
          scheduled = true;
          requestAnimationFrame(runFixes);
        };

        const root = document.getElementById('root');
        const observer = new MutationObserver(scheduleRun);

        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }

        window.addEventListener('load', runFixes, { once: true });
        window.addEventListener('resize', applyMobileChargerFix);

        [50, 300, 1000, 2000].forEach((delay) => {
          setTimeout(runFixes, delay);
        });
      })();
    </script>
    
    <script>
  (() => {
    const navMap = [
      { label: 'Story', id: 'story', selector: '.sticky-story' },
      { label: 'Services', id: 'services', selector: '.service-grid' },
      { label: 'Why Us', id: 'why-us', selector: '.why-section' },
      { label: 'Process', id: 'process', selector: '.timeline' },
      { label: 'FAQ', id: 'faq', selector: '.faq-section' }
    ];

    const getSectionRoot = (selector) => {
      const el = document.querySelector(selector);
      if (!el) return null;

      return (
        el.closest('section') ||
        el.closest('.content-section') ||
        el.closest('.split-section') ||
        el.closest('.sticky-story') ||
        el.closest('.showcase-section') ||
        el.closest('.why-section') ||
        el.closest('.faq-section') ||
        el
      );
    };

    const setupNavSpy = () => {
      const nav = document.querySelector('.nav-links');
      if (!nav) return false;

      const links = Array.from(nav.querySelectorAll('a'));
      if (!links.length) return false;

      const sections = navMap
        .map((item) => {
          const section = getSectionRoot(item.selector);
          if (!section) return null;

          section.id = item.id;

          const link = links.find((a) => {
            const text = a.textContent.trim().toLowerCase();
            return text === item.label.toLowerCase();
          });

          if (link) {
            link.href = `#${item.id}`;
            link.dataset.spyTarget = item.id;
          }

          return { ...item, section, link };
        })
        .filter(Boolean);

      if (!sections.length) return false;

      const setActive = (id) => {
        links.forEach((link) => {
          link.classList.toggle('is-active', link.dataset.spyTarget === id);
        });
      };

      const updateActive = () => {
        const marker = window.scrollY + window.innerHeight * 0.38;

        let current = sections[0];

        for (const item of sections) {
          if (item.section.offsetTop <= marker) {
            current = item;
          }
        }

        if (current) setActive(current.id);
      };

      links.forEach((link) => {
        link.addEventListener('click', (e) => {
          const id = link.dataset.spyTarget;
          const target = id ? document.getElementById(id) : null;

          if (!target) return;

          e.preventDefault();

          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });

          history.replaceState(null, '', `#${id}`);
          setActive(id);
        });
      });

      let ticking = false;

      window.addEventListener('scroll', () => {
        if (ticking) return;

        ticking = true;

        requestAnimationFrame(() => {
          updateActive();
          ticking = false;
        });
      }, { passive: true });

      window.addEventListener('resize', updateActive);

      setTimeout(updateActive, 100);
      setTimeout(updateActive, 800);

      return true;
    };

    let tries = 0;

    const timer = setInterval(() => {
      tries++;

      if (setupNavSpy() || tries > 40) {
        clearInterval(timer);
      }
    }, 100);

    window.addEventListener('load', setupNavSpy, { once: true });
  })();
</script>

<script>
(() => {
  const buildBoxShowcase = () => {
    const sections = Array.from(document.querySelectorAll('.split-section'));

    const whoSection = sections.find((section) => {
      const text = (section.textContent || '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();

      return (
        text.includes('who we are') ||
        text.includes('technical ev charging partner')
      );
    });

    if (!whoSection) return false;

    const imageBox = whoSection.querySelector('.split-image');
    if (!imageBox) return false;

    if (imageBox.querySelector('.box-3d-showcase')) return true;

    imageBox.dataset.boxShowcaseReady = '1';
    imageBox.classList.add('box-gallery-host');

    imageBox.innerHTML = `
      <div class="box-3d-showcase" aria-label="EVTechnical charger box gallery">
        ${[1, 2, 3, 4, 5, 6, 7].map((n) => `
          <figure class="box-3d-card box-card-${n}">
            <img src="/images/box/${n}.png" alt="EVTechnical charger box view ${n}" loading="lazy">
          </figure>
        `).join('')}

        <div class="box-3d-core">
          <span>EVTechnical</span>
          <strong>Charger Hardware</strong>
        </div>
      </div>
    `;

    return true;
  };

  const run = () => {
    if (buildBoxShowcase()) {
      return true;
    }

    return false;
  };

  run();

  const root = document.getElementById('root') || document.body;

  const observer = new MutationObserver(() => {
    if (run()) {
      observer.disconnect();
    }
  });

  observer.observe(root, {
    childList: true,
    subtree: true
  });

  window.addEventListener('load', run);

  [100, 300, 800, 1500, 3000].forEach((delay) => {
    setTimeout(run, delay);
  });
})();
</script>

<script>
(() => {
  const initSmoothBoxOrbit = () => {
    const stage = document.querySelector('.box-3d-showcase');
    if (!stage || stage.dataset.smoothOrbitReady === '1') return false;

    const cards = Array.from(stage.querySelectorAll('.box-3d-card'));
    if (!cards.length) return false;

    stage.dataset.smoothOrbitReady = '1';
    stage.classList.add('orbit-gallery');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return true;

    const count = cards.length;
    const duration = 21000;
    const orbitSpeed = 0.11;

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);

    const centerPulse = (t) => {
      if (t < 0.24) return smoother(t / 0.24);
      if (t < 0.58) return 1;
      return 1 - smoother((t - 0.58) / 0.42);
    };

    let start = performance.now();
    let rafId = null;

    const animate = (now) => {
      const rect = stage.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      const mobile = w < 520;

      const rx = mobile
        ? clamp(w * 0.31, 95, 135)
        : clamp(w * 0.34, 160, 245);

      const ry = mobile
        ? clamp(h * 0.34, 135, 185)
        : clamp(h * 0.30, 150, 220);

      const progress = ((now - start) % duration) / duration;
      const activeFloat = progress * count;

      cards.forEach((card, i) => {
        const baseAngle =
          ((i / count) + progress * orbitSpeed) * Math.PI * 2 - Math.PI / 2;

        const baseX = Math.cos(baseAngle) * rx;
        const baseY = Math.sin(baseAngle) * ry;

        const depth = (Math.sin(baseAngle) + 1) / 2;

        let local = (activeFloat - i + count) % count;
        let center = local < 1 ? centerPulse(local) : 0;

        const x = lerp(baseX, 0, center);
        const y = lerp(baseY, 0, center);

        const baseScale = lerp(0.68, 0.9, depth);
        const scale = lerp(baseScale, mobile ? 1.12 : 1.22, center);

        const z = Math.round(10 + depth * 28 + center * 120);
        const opacity = lerp(0.48 + depth * 0.34, 1, center);
        const brightness = lerp(0.78 + depth * 0.22, 1.16, center);
        const blur = lerp(0.4, 0, center);

        card.style.zIndex = z;
        card.style.opacity = opacity.toFixed(3);
        card.style.filter = `brightness(${brightness.toFixed(3)}) blur(${blur.toFixed(2)}px)`;
        card.style.transform = `
          translate(-50%, -50%)
          translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${center * 100}px)
          scale(${scale.toFixed(3)})
        `;

        card.classList.toggle('is-center', center > 0.72);
      });

      rafId = requestAnimationFrame(animate);
    };

    const startAnimation = () => {
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    const stopAnimation = () => {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    };

    const observer = new IntersectionObserver((entries) => {
      if (entries[0]?.isIntersecting) {
        startAnimation();
      } else {
        stopAnimation();
      }
    }, { threshold: 0.12 });

    observer.observe(stage);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAnimation();
      else startAnimation();
    });

    startAnimation();
    return true;
  };

  initSmoothBoxOrbit();

  const root = document.getElementById('root') || document.body;
  const observer = new MutationObserver(() => {
    if (initSmoothBoxOrbit()) observer.disconnect();
  });

  observer.observe(root, { childList: true, subtree: true });

  window.addEventListener('load', initSmoothBoxOrbit);
})();
</script>
